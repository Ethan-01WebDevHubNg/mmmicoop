<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Forgot Password - Cooperative Society</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="/assets/icon-192.png">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script type="module" src="../js/systemmaintenance.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#e11919",
              "background-light": "#f8f6f6",
              "background-dark": "#0f172a",
            },
            fontFamily: { "display": ["Manrope", "sans-serif"] },
          },
        },
      }
    </script>
    <style type="text/tailwindcss">
      body { @apply font-display; }
      .form-input { @apply block w-full rounded-lg border-0 bg-white/5 py-3 px-4 text-white ring-1 ring-inset ring-white/10 focus:ring-2 focus:ring-inset focus:ring-primary; }
    </style>
</head>
<body class="antialiased h-screen w-screen overflow-hidden bg-background-light dark:bg-background-dark flex flex-col">

    <main class="flex-1 flex items-center justify-center px-4 sm:px-6 lg:px-8 relative z-10">
        <div class="w-full max-w-md space-y-6">
            <div class="flex flex-col items-center justify-center text-center">
                <div class="mb-4">
                    <img class="h-20 w-auto" alt="Mountain Moving Ministry Intl Logo" src="https://mountainmovingministryintl.org/gallery/MMMi%20Header%20logo.svg"/>
                </div>
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 dark:text-white">Forgot Your Password?</h1>
                <p class="mt-2 text-sm text-slate-600 dark:text-slate-400">
                    Enter your email address to receive a reset link.
                </p>
            </div>

            <div class="rounded-xl bg-white/5 p-6 sm:p-8 shadow-2xl shadow-black/20 backdrop-blur-sm ring-1 ring-black/5 dark:ring-white/10">
                <form class="space-y-5" id="reset-form">
                    <div>
                        <label class="block text-sm font-medium leading-6 text-slate-700 dark:text-slate-300" for="email">Email Address</label>
                        <div class="relative mt-2">
                            <input autocomplete="email" class="form-input text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-500" id="email" name="email" placeholder="Enter your email address" required type="email"/>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3">
                                <span class="material-symbols-outlined text-slate-400 dark:text-slate-500">mail</span>
                            </div>
                        </div>
                    </div>
                    <div>
                        <button class="flex w-full justify-center rounded-lg bg-primary px-3 py-3 text-sm font-semibold leading-6 text-white shadow-sm transition duration-300 ease-in-out hover:bg-red-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary" type="submit" id="reset-btn">Send Reset Link</button>
                    </div>
                </form>
                <div class="mt-6 text-center">
                    <p class="text-sm">
                        <a class="font-semibold text-primary transition duration-300 ease-in-out hover:text-red-700" href="/auth/index.html">Back to Login</a>
                    </p>
                </div>
            </div>
        </div>
    </main>
    
    <footer class="w-full py-4 px-4 text-center z-10">
        <div class="text-xs sm:text-sm text-slate-500 dark:text-slate-400">
            <p>© 2026 <a class="hover:text-primary hover:underline" href="https://mountainmovingministryintl.org/" target="_blank">Mountain Moving Ministry Intl.</a></p>
            <a class="font-medium text-primary hover:text-red-700 block mt-1" href="https://ethan01.com" target="_blank">Contact Developer</a>
        </div>
    </footer>

<script type="module">
    import { auth } from "../js/firebase-init.js";
    import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // CONFIGURATION: Tells Firebase where to send the user after they click the email link
    const actionCodeSettings = {
        // This must be the exact URL of your "Set New Password" page
        url: 'https://cooperative.mountainmovingministryintl.org/auth/set-new-pw',
        handleCodeInApp: true
    };

    const form = document.getElementById('reset-form');
    
    if (form) {
        form.addEventListener('submit', async (e) => {
            e.preventDefault(); // This stops the page reload/URL change
            
            const emailInput = document.getElementById('email');
            const email = emailInput.value;
            const btn = document.getElementById('reset-btn');
            const originalText = btn.innerHTML;

            try {
                // UI Loading State
                btn.innerHTML = 'Sending...';
                btn.disabled = true;

                // Send Email with Settings
                await sendPasswordResetEmail(auth, email, actionCodeSettings);
                
                // Save email for the "Resend" button on the next page
                localStorage.setItem('resetEmail', email);
                
                // Redirect to success page
                window.location.href = '/auth/set-new-pw-sent';
                
            } catch (error) {
                console.error("Firebase Error:", error);
                alert("Error: " + error.message);
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
    } else {
        console.error("Form element 'reset-form' not found!");
    }
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(() => console.log('Service Worker Registered'))
        .catch(err => console.error('Service Worker Failed:', err));
    });
  }
</script>
</body>
</html>
