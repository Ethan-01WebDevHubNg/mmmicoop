<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>System Maintenance - MMMI Portal</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="/assets/icon-192.png">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
    
    <script type="module" src="/js/systemmaintenance.js"></script>

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#e31919",
              "background-light": "#f8fafc",
              "background-dark": "#0f172a",
              "text-light": "#0f172a",
              "text-dark": "#e2e8f0",
              "subtext-light": "#64748b",
              "subtext-dark": "#94a3b8"
            },
            fontFamily: {
              "display": ["Manrope", "sans-serif"]
            },
          },
        },
      }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48; }
    </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark overflow-hidden h-screen w-screen flex flex-col items-center justify-center">

    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] rounded-full bg-primary/5 blur-3xl"></div>
        <div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] rounded-full bg-primary/5 blur-3xl"></div>
    </div>

    <div class="relative z-10 w-full max-w-lg px-6 text-center">
        <div class="mb-8 flex justify-center">
             <img alt="Mountain Moving Ministry Intl. Logo" class="h-16 w-auto" src="https://mountainmovingministryintl.org/gallery/MMMi%20Header%20logo.svg"/>
        </div>

        <div class="relative inline-flex items-center justify-center w-24 h-24 mb-8 bg-slate-100 dark:bg-slate-800 rounded-full">
            <span class="absolute inset-0 rounded-full border-4 border-primary/20 animate-ping"></span>
            <span class="material-symbols-outlined text-primary text-5xl">engineering</span>
        </div>

        <h1 class="text-3xl md:text-4xl font-black tracking-tight mb-4">System Under Maintenance</h1>
        <p class="text-subtext-light dark:text-subtext-dark text-lg leading-relaxed mb-6">
            We are currently performing scheduled upgrades. Access to the portal is temporarily unavailable.
        </p>

        <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-yellow-100 dark:bg-yellow-900/30 text-yellow-800 dark:text-yellow-300 border border-yellow-200 dark:border-yellow-700/50 mb-8">
            <span class="relative flex h-2.5 w-2.5">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-yellow-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-yellow-500"></span>
            </span>
            <span class="text-sm font-bold tracking-wide">Status: Ongoing</span>
        </div>

        <div class="mb-8">
            <p class="text-xs font-bold tracking-widest text-primary uppercase mb-3">Estimated Completion</p>
            <div class="flex flex-wrap justify-center gap-4">
                <div class="flex flex-col items-center bg-card-light dark:bg-card-dark border border-slate-200 dark:border-slate-700 p-3 rounded-lg min-w-[70px] shadow-sm">
                    <span id="days" class="text-2xl font-black text-text-light dark:text-text-dark">00</span>
                    <span class="text-xs text-subtext-light dark:text-subtext-dark uppercase">Days</span>
                </div>
                <div class="flex flex-col items-center bg-card-light dark:bg-card-dark border border-slate-200 dark:border-slate-700 p-3 rounded-lg min-w-[70px] shadow-sm">
                    <span id="hours" class="text-2xl font-black text-text-light dark:text-text-dark">00</span>
                    <span class="text-xs text-subtext-light dark:text-subtext-dark uppercase">Hours</span>
                </div>
                <div class="flex flex-col items-center bg-card-light dark:bg-card-dark border border-slate-200 dark:border-slate-700 p-3 rounded-lg min-w-[70px] shadow-sm">
                    <span id="minutes" class="text-2xl font-black text-text-light dark:text-text-dark">00</span>
                    <span class="text-xs text-subtext-light dark:text-subtext-dark uppercase">Mins</span>
                </div>
                <div class="flex flex-col items-center bg-card-light dark:bg-card-dark border border-slate-200 dark:border-slate-700 p-3 rounded-lg min-w-[70px] shadow-sm">
                    <span id="seconds" class="text-2xl font-black text-primary">00</span>
                    <span class="text-xs text-subtext-light dark:text-subtext-dark uppercase">Secs</span>
                </div>
            </div>
        </div>

        <div class="border-t border-slate-200 dark:border-slate-800 pt-6">
            <p class="text-sm text-subtext-light dark:text-subtext-dark">
                Need urgent assistance? <a href="mailto:support@mountainmovingministryintl.org" class="text-primary hover:underline font-medium">Email Support</a>
            </p>
        </div>
    </div>
    <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(() => console.log('Service Worker Registered'))
        .catch(err => console.error('Service Worker Failed:', err));
    });
  }
</script>
</body>
</html>
