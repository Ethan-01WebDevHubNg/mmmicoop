<script>
document.addEventListener('DOMContentLoaded', () => {
    const continueButton = document.getElementById('continue-browsing-button');

    if (continueButton) {
        continueButton.addEventListener('click', () => {
            // Check if there is a referrer (history exists)
            if (document.referrer) {
                // Navigate to the referrer, which effectively reloads it
                window.location.href = document.referrer;
            } else {
                // No history/direct access, redirect to login
                window.location.href = '../auth/';
            }
        });
    }
});
</script>
